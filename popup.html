<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; margin: 0; background: #fafafa; }
    h3 { margin-top: 0; color: #111; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    label { font-size: 12px; color: #555; font-weight: 500; }
    input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    .scope { display: flex; gap: 14px; margin: 6px 0; }
    .scope label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; cursor: pointer; }
    .scope input { width: auto; margin: 0; padding: 0; accent-color: #007aff; }
    .scope-hint { font-size: 11px; color: #888; margin: 0 0 10px; line-height: 1.4; }
    button { width: 100%; padding: 10px; background: #007aff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.2s; }
    button:hover { background: #0056b3; }
    .status { font-size: 12px; margin-top: 8px; color: #28a745; display: none; text-align: center; font-weight: 500; }
    .thresholds { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 8px; align-items: center; margin: 8px 0; }
    .thresholds label { margin: 0; }
    .thresholds input { width: 56px; margin: 0; text-align: center; }
    .thresholds .upper { background: #f0f4ff; border-color: #9db4e8; }
  </style>
</head>
<body>
  <h3>Jev Guard Settings</h3>
  <label for="apiKey">TypeSafe Jev API Token:</label>
  <input type="password" id="apiKey" placeholder="jev_live_...">
  <label>Scan scope:</label>
  <div class="scope">
    <label><input type="radio" name="scanScope" value="page" checked> Entire page</label>
    <label><input type="radio" name="scanScope" value="selection"> Selected text only</label>
  </div>
  <div class="scope-hint">“Selected text only” skips automatic scanning — analyze a fragment via right-click → “Jev Content Guard: check selection”.</div>
  <label>Trigger thresholds (%) · lower / upper:</label>
  <div class="thresholds">
    <label for="th_is_fraud">⚠️ Fraud</label>
    <input type="number" id="th_is_fraud" min="1" max="100" value="50">
    <input type="number" id="thu_is_fraud" class="upper" min="1" max="100" value="80">
    <label for="th_is_advertising">📢 Advertising</label>
    <input type="number" id="th_is_advertising" min="1" max="100" value="20">
    <input type="number" id="thu_is_advertising" class="upper" min="1" max="100" value="80">
    <label for="th_is_ai_generated">🤖 AI generation</label>
    <input type="number" id="th_is_ai_generated" min="1" max="100" value="25">
    <input type="number" id="thu_is_ai_generated" class="upper" min="1" max="100" value="80">
    <label for="th_is_spam">🚫 Spam</label>
    <input type="number" id="th_is_spam" min="1" max="100" value="25">
    <input type="number" id="thu_is_spam" class="upper" min="1" max="100" value="80">
    <label for="th_is_clickbait">🪤 Clickbait</label>
    <input type="number" id="th_is_clickbait" min="1" max="100" value="20">
    <input type="number" id="thu_is_clickbait" class="upper" min="1" max="100" value="80">
    <label for="th_is_infobusiness">💎 Infobusiness</label>
    <input type="number" id="th_is_infobusiness" min="1" max="100" value="25">
    <input type="number" id="thu_is_infobusiness" class="upper" min="1" max="100" value="80">
    <label for="th_is_toxic">🤬 Toxicity</label>
    <input type="number" id="th_is_toxic" min="1" max="100" value="25">
    <input type="number" id="thu_is_toxic" class="upper" min="1" max="100" value="80">
    <label for="th_is_plagiat">📕 Plagiat</label>
    <input type="number" id="th_is_plagiat" min="1" max="100" value="25">
    <input type="number" id="thu_is_plagiat" class="upper" min="1" max="100" value="80">
  </div>
  <button id="saveBtn">Save settings</button>
  <div id="status" class="status">Settings saved successfully!</div>

  <script src="popup.js"></script>
</body>
</html>
